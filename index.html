<!doctype html>
<html lang="de">
  <head>
<!--

  ,     ,
  )\___/(     Hallo, ich bin Sebi!
 {(@)v(@)}    Ich bin der Entwickler.

Hier kannst du mithelfen, die Website zu verbessern:
https://github.com/Sebiworld/musical-fabrik.de

-->
    <meta charset="UTF-8" />
    <title data-static-seo="title">Musical-Fabrik e.V.</title>

    <!-- Static fallbacks for link previews and crawlers that do not run scripts.
         SeoHeaders removes the entries it replaces with page-specific values. -->
    <meta
      name="description"
      data-static-seo="description"
      content="Der Musical-Fabrik e.V. ist ein gemeinnütziger Verein, der generations-, interessen- und grenzübergreifend Menschen die Gelegenheit gibt, ihr Können auszuleben."
    />
    <meta property="og:title" data-static-seo="og:title" content="Musical-Fabrik e.V." />
    <meta
      property="og:description"
      data-static-seo="og:description"
      content="Der Musical-Fabrik e.V. ist ein gemeinnütziger Verein, der generations-, interessen- und grenzübergreifend Menschen die Gelegenheit gibt, ihr Können auszuleben."
    />
    <meta
      property="og:image"
      data-static-seo="og:image"
      content="https://www.musical-fabrik.de/img/og-share-preview.jpg"
    />
    <meta property="og:image:width" data-static-seo="og:image:width" content="1200" />
    <meta property="og:image:height" data-static-seo="og:image:height" content="630" />
    <meta property="og:type" data-static-seo="og:type" content="website" />
    <meta property="og:site_name" data-static-seo="og:site_name" content="Musical-Fabrik e.V." />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" data-static-seo="twitter:card" content="summary_large_image" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <meta name="msapplication-tap-highlight" content="no" />

    <!-- The font rules are injected by the app bundle; preloading the two faces used above the fold
         starts their download with the document instead of after the bundle has run. -->
    <link
      rel="preload"
      href="/assets/fonts/aileron/Aileron-Light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/aileron/Aileron-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- For old IEs -->
    <link rel="shortcut icon" href="/assets/favicons/favicon.ico" />

    <!-- For new browsers - multisize ico  -->
    <link
      rel="icon"
      type="image/x-icon"
      sizes="16x16 32x32"
      href="/assets/favicons/favicon.ico"
    />

    <!-- For iPad with high-resolution Retina display running iOS ≥ 7: -->
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="/assets/favicons/favicon-152-precomposed.png"
    />

    <!-- For iPad with high-resolution Retina display running iOS ≤ 6: -->
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/assets/favicons/favicon-144-precomposed.png"
    />

    <!-- For iPhone with high-resolution Retina display running iOS ≥ 7: -->
    <link
      rel="apple-touch-icon"
      sizes="120x120"
      href="/assets/favicons/favicon-120-precomposed.png"
    />

    <!-- For iPhone with high-resolution Retina display running iOS ≤ 6: -->
    <link
      rel="apple-touch-icon"
      sizes="114x114"
      href="/assets/favicons/favicon-114-precomposed.png"
    />

    <!-- For iPhone 6+ -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/favicon-180-precomposed.png"
    />

    <!-- For first- and second-generation iPad: -->
    <link
      rel="apple-touch-icon"
      sizes="72x72"
      href="/assets/favicons/favicon-72-precomposed.png"
    />

    <!-- For non-Retina iPhone, iPod Touch, and Android 2.1+ devices: -->
    <link
      rel="apple-touch-icon"
      sizes="57x57"
      href="/assets/favicons/favicon-57.png"
    />

    <!-- For Old Chrome -->
    <link rel="icon" sizes="32x32" href="/assets/favicons/favicon-32.png" />

    <!-- For IE10 Metro -->
    <meta name="msapplication-TileColor" content="#FFFFFF" />
    <meta
      name="msapplication-TileImage"
      content="/assets/favicons/favicon-144.png"
    />
    <meta name="theme-color" content="#fd8e00" />

    <!-- Chrome for Android -->
    <link rel="manifest" crossorigin="use-credentials" href="/manifest.webmanifest" />
    <link rel="icon" sizes="192x192" href="/assets/favicons/favicon-192.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
